postgres:
  dsn: "postgres://postgres:${PGPASSWORD}@127.0.0.1:5432/forensic"
  min_pool: 1
  max_pool: 10
  timeout: 60

tracing:
  max_depth: 6
  max_nodes: 5000
  max_edges: 10000
  expand_internal_transfers: true
  expand_contract_calls: true
  expand_token_transfers: true

chains:
  tron:
    enabled: true
    flow_view: "v_tron_flows"
    tx_table: "tron_transactions"
    address_column: "address"
    txid_column: "txid"
    block_column: "block_number"
    timestamp_column: "ts"

  eth:
    enabled: true
    flow_view: "v_eth_flows"
    tx_table: "eth_transactions"
    address_column: "address"
    txid_column: "txid"
    block_column: "block_number"
    timestamp_column: "ts"

  btc:
    enabled: true
    utxo_view: "v_btc_utxo_flows"
    tx_table: "btc_transactions"
    block_table: "btc_blocks"
    address_column: "address"
    txid_column: "txid"
    timestamp_column: "ts"

multi_chain:
  enabled: true
  unified_view: "v_forensic_cockpit"

logging:
  level: "INFO"
  file: "logs/forensic_suite_v2.log"
  rotate: true
  max_size_mb: 20
  backups: 5
