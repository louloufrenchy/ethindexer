[metadata]
name = forensic_suite_v2
version = 0.1.0
description = Unified multi-chain forensic suite
author = Louis
license = MIT

[options]
packages = find:
package_dir =
    = .
python_requires = >=3.10

[options.packages.find]
where = forensic_suite_v2

[flake8]
max-line-length = 120
ignore = E302,E305,E501,F841
exclude = venv,.git,__pycache__,dashboards,grafana

[tool:pytest]
testpaths = tests