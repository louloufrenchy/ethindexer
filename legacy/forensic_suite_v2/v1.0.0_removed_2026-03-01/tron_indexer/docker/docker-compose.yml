version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tron
      POSTGRES_PASSWORD: tronpass
      POSTGRES_DB: tron_index
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  tron_indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexer
    environment:
      CONFIG_PATH: "/app/config/indexer.yaml"
    depends_on:
      - postgres
    volumes:
      - ../config:/app/config
      - ../logs:/app/logs

  tron_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      CONFIG_PATH: "/app/config/indexer.yaml"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config
      - ../logs:/app/logs
