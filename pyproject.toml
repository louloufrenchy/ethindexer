[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-suite-v2"
version = "0.1.2"
description = "Forensic Suite v2 - Multi-chain blockchain analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Louis", email = "support@netbizint.com.au" }
]

dependencies = [
    "click>=8.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.28",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyside6>=6.6",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "orjson>=3.9.0",
    "prometheus_client>=0.20.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0"
]

[project.scripts]
# --- Core Indexers ---
forensic-suite-v2-run-btc-indexer = "forensic_suite_v2.btc_indexer.services.run_btc_indexer_v2:main"
forensic-suite-v2-run-eth-indexer = "forensic_suite_v2.eth_indexer.services.run_eth_indexer_v2:main"
forensic-suite-v2-run-tron-indexer = "forensic_suite_v2.tron_indexer.services.run_tron_indexer_v2:main"

# --- Optional Daemons ---
forensic-suite-v2-run-tron-token-daemon = "forensic_suite_v2.tron_indexer.services.token_daemon:main"
forensic-suite-v2-run-api-server = "forensic_suite_v2.tron_indexer.services.api_server:main"

# --- Existing CLI Tools (unchanged) ---
forensic-suite-v2 = "forensic_suite_v2.cli.__main__:cli"
forensic-suite-v2-gui = "forensic_suite_v2.gui.app:launch_gui"
forensic-suite-v2-dashboard = "forensic_suite_v2.cli.__main__:dashboard"
forensic-suite-v2-run-all = "forensic_suite_v2.cli.__main__:run_all"
forensic-suite-v2-health = "forensic_suite_v2.cli.__main__:health_api"

[tool.setuptools.packages.find]
where = ["."]
include = ["forensic_suite_v2*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
forensic_suite_v2 = [
    "dashboards/*.ps1",
    "config/*.yaml",
    "gui/*.py",
    "gui/**/*.py",
    "gui/**/*.ui",
    "gui/**/*.png",
    "gui/**/*.ico",
    "gui/**/*.qrc",
    "tools/*.ps1"
]
